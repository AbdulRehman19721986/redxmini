name: Request redeploy

# PUBLIC REPO ONLY — this workflow does NOT build, deploy, or access
# application source. It only asks the PRIVATE repo's own deploy.yml
# (workflow_dispatch) to run. Source never touches this runner.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are you requesting a redeploy?"
        required: false
        default: "manual request"

permissions:
  contents: read

concurrency:
  group: request-redeploy
  cancel-in-progress: false

env:
  # ── Identify the PRIVATE repo's workflow to trigger ──────────────────────
  # Change these three values to match your setup. Do NOT put secrets here.
  PRIVATE_REPO_OWNER: "your-github-username"
  PRIVATE_REPO_NAME: "your-private-repo-name"
  PRIVATE_WORKFLOW_FILE: "deploy.yml"
  PRIVATE_REPO_REF: "main"

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate configuration
        run: |
          if [ "${PRIVATE_REPO_OWNER}" = "your-github-username" ] || \
             [ "${PRIVATE_REPO_NAME}" = "your-private-repo-name" ]; then
            echo "::error::PRIVATE_REPO_OWNER and PRIVATE_REPO_NAME must be set in the workflow env block." >&2
            exit 1
          fi

      - name: Call workflow_dispatch on the private repo
        env:
          REDX_PRIVATE_REPO_TOKEN: ${{ secrets.REDX_PRIVATE_REPO_TOKEN }}
        run: |
          # Fail fast if the secret is not configured.
          if [ -z "${REDX_PRIVATE_REPO_TOKEN}" ]; then
            echo "::error::REDX_PRIVATE_REPO_TOKEN is not configured as an Actions secret on this repo. See SECURITY.md." >&2
            exit 1
          fi

          # Build API URL from explicit, trusted env vars only.
          # User-supplied 'reason' input is NOT interpolated into the shell command.
          API_URL="https://api.github.com/repos/${PRIVATE_REPO_OWNER}/${PRIVATE_REPO_NAME}/actions/workflows/${PRIVATE_WORKFLOW_FILE}/dispatches"

          # Send dispatch. Token is injected via env var; never printed.
          # -S: show errors. -o: discard response body. -w: capture status code only.
          HTTP_STATUS=$(curl -sSf \
            -o /tmp/gh_response.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${REDX_PRIVATE_REPO_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}" \
            --data-raw "{\"ref\":\"${PRIVATE_REPO_REF}\"}" || true)

          echo "GitHub API responded: HTTP ${HTTP_STATUS}"

          # 204 No Content = success for this endpoint.
          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "::error::Dispatch failed (HTTP ${HTTP_STATUS}). Check that REDX_PRIVATE_REPO_TOKEN has Actions: Read and write on the private repo, and that the workflow file name and branch are correct." >&2
            # Print response body for debugging — it contains no secrets.
            cat /tmp/gh_response.txt >&2
            exit 1
          fi

          echo "Redeploy requested on ${PRIVATE_REPO_OWNER}/${PRIVATE_REPO_NAME}@${PRIVATE_REPO_REF}."
          echo "Reason: ${{ inputs.reason }}"
